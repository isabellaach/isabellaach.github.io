      <line x1="540" y1="200" x2="540" y2="590"/>
      <line x1="720" y1="200" x2="720" y2="590"/>
      <line x1="900" y1="200" x2="900" y2="590"/>
      <line x1="1080" y1="200" x2="1080" y2="590"/>
    </g>
    <g font-size="20" fill="#5A6478" text-anchor="middle">
      <text x="360" y="622">0</text><text x="540" y="622">0,25</text><text x="720" y="622">0,50</text><text x="900" y="622">0,75</text><text x="1080" y="622">1</text>
    </g>
    <!-- barras -->
    <rect x="360" y="226" width="461.5" height="74" rx="6" fill="#C7CEDB"/>
    <rect x="360" y="346" width="618.5" height="74" rx="6" fill="#C7CEDB"/>
    <rect x="360" y="466" width="612" height="74" rx="6" fill="#1B2A4A"/>
    <g font-size="25" fill="#16233F">
      <text x="64" y="258" font-weight="700">Zero-shot</text><text x="64" y="288" font-size="20" fill="#5A6478">sin entrenar · 40 ms</text>
      <text x="64" y="378" font-weight="700">Qwen2.5-3B</text><text x="64" y="408" font-size="20" fill="#5A6478">LLM local · ~900 ms</text>
